# Configuration de la chaîne de clipping GTA.
# Les clés API ne vont JAMAIS ici : elles sont dans /etc/clipper.env sur le serveur.

timezone: Europe/Paris

# Catégories Twitch acceptées (noms exacts Twitch).
games: ["Grand Theft Auto VI", "Grand Theft Auto V"]

fetch:
  lookback_hours: 48        # clips créés dans les 48 dernières heures
  clips_per_streamer: 10    # les N clips les plus vus par streamer
  min_views: 300            # en dessous, on ignore
  process_per_run: 6        # clips montés par passage
  max_ready_per_lang: 4     # stock max de clips prêts par langue (hébergement < 1 Go)
  discover: {en: 1000, fr: 200}  # + meilleurs clips GTA de TOUT Twitch dans ces langues (vues mini)

# Règles issues de l'analyse du 17/11/2026 (240 TikTok + 120 Shorts GTA).
# Mises à jour automatiquement par l'analyse hebdomadaire.
rules:
  min_seconds: 20           # jamais plus court
  max_seconds: 90
  context_before: 8         # secondes de VOD ajoutées avant le clip (contexte)
  context_after: 4
  max_silence: 0.8          # temps mort coupé au-delà (s)
  hook_seconds: 2.5         # texte d'accroche affiché au début
  program_boost: 2.0        # priorité des streamers avec programme de clipping
  face_bonus: 1.5           # publication : priorité aux clips avec facecam (couverture avec un visage)

publish:
  max_per_day: 6            # par langue, par plateforme (semaine de sortie de GTA 6)
  window_minutes: 90        # GitHub lance le passage horaire avec du retard : large tolérance
  max_clip_age_hours: 24     # clips frais seulement (montés et publiés), avant les autres clippeurs
  slots:                    # heure de Paris
    fr: ["12:30", "15:00", "17:30", "19:00", "21:30", "23:00"]
    en: ["14:00", "16:00", "18:30", "21:00", "00:30", "03:00"]   # soirée US = nuit à Paris
  youtube_category: "20"    # Gaming
  tiktok_profiles: {en: wastedreplay2, fr: wasted_gta6}   # relevé hebdo des vues (APIFY_TOKEN)

style:
  font: DejaVu Sans
  font_size: 88
  words_per_group: 3

models:
  whisper: small            # faster-whisper, CPU int8
  ollama: qwen2.5:7b

# Invités : un clip dont le titre Twitch ou les paroles citent un de ces noms est monté en priorité
# (même peu vu, même stock plein) et publié tout de suite EN PLUS des créneaux.
vip: ["lea elui", "leaelui"]

# Liste autorisée. program = lien du programme de clipping (null si aucun).
# facecam: auto (détection), none, ou [x, y, largeur, hauteur] en fractions de l'image.
# min_views (optionnel) : remplace fetch.min_views pour ce streamer.
# own_subs (optionnel) : true si le streamer incruste déjà ses sous-titres (on n'en ajoute pas).
# boost (optionnel) : multiplie la priorité (analyse TikTok du 25/11 : Anyme023/Michou/Squeezie marchent, Domingo non).
