# Passage horaire (GitHub Actions) : commandes Telegram, publication, récupération + montage, récap.
# L'état (base SQLite + vidéos) vit sur la branche "data" ; les vidéos sont servies par GitHub Pages
# (Buffer exige une URL HTTPS publique).
name: clipper

on:
  schedule:
    - cron: "7 * * * *"   # toutes les heures (GitHub peut retarder de quelques minutes)
  workflow_dispatch:       # bouton "Run workflow" pour lancer à la main
    inputs:
      command:
        description: "tick (normal), test (publie un clip tout de suite), run (montage seul), redo (remonte les clips prêts), channels"
        default: tick

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: clipper
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment:
      name: github-pages
    env:
      CLIPPER_DATA: data
      PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      CLIPPER_BUFFER_KEY_FR: ${{ secrets.CLIPPER_BUFFER_KEY_FR }}
      CLIPPER_BUFFER_KEY_EN: ${{ secrets.CLIPPER_BUFFER_KEY_EN }}
      CLIPPER_BUFFER_CHANNELS_FR: ${{ secrets.CLIPPER_BUFFER_CHANNELS_FR }}
      CLIPPER_BUFFER_CHANNELS_EN: ${{ secrets.CLIPPER_BUFFER_CHANNELS_EN }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer l'état (branche data)
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          git clone -q --depth 1 --branch data "$URL" data || { mkdir -p data && git -C data init -q -b data && git -C data remote add origin "$URL"; }
          mkdir -p data/out

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache des modèles (Whisper + Ollama + voix + visages)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.ollama/models
            ~/.cache/clipper
          key: models-small-qwen2.5-7b-voix-visages-ffmpeg

      - name: Installer
        run: |
          # ffmpeg (avec libass) et police depuis GitHub + cache : le miroir apt d'Ubuntu a déjà mis 13 min
          mkdir -p ~/.cache/clipper/bin ~/.cache/clipper/fonts && echo "$HOME/.cache/clipper/bin" >> "$GITHUB_PATH"
          [ -x ~/.cache/clipper/bin/ffmpeg ] || curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ -C ~/.cache/clipper/bin --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          [ -f ~/.cache/clipper/fonts/DejaVuSans-Bold.ttf ] || curl -fsSL https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.tar.bz2 | tar xj -C ~/.cache/clipper/fonts --strip-components=2 --wildcards '*/ttf/DejaVuSans.ttf' '*/ttf/DejaVuSans-Bold.ttf'
          export PATH="$HOME/.cache/clipper/bin:$PATH" && ffmpeg -hide_banner -filters | grep -q " ass " || { echo "ffmpeg sans libass"; exit 1; }
          pip install -q -r requirements.txt
          command -v zstd >/dev/null || sudo apt-get install -y -q zstd
          curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /usr
          (ollama serve > /tmp/ollama.log 2>&1 &) && sleep 3 && ollama pull qwen2.5:7b
          R=https://github.com/k2-fsa/sherpa-onnx/releases/download; mkdir -p ~/.cache/clipper && cd ~/.cache/clipper
          if [ ! -f segmentation.onnx ]; then
            curl -fsSL $R/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2 | tar xj --strip-components=1 sherpa-onnx-pyannote-segmentation-3-0/model.onnx
            mv model.onnx segmentation.onnx
          fi
          [ -f embedding.onnx ] || curl -fsSL -o embedding.onnx $R/speaker-recongition-models/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx
          [ -f yunet.onnx ] || curl -fsSL -o yunet.onnx https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx

      - name: Passage
        env:
          CMD: ${{ inputs.command || 'tick' }}
        run: python -m clipper "$CMD"

      - name: Sauvegarder l'état
        if: always()
        working-directory: data
        run: |
          git add -A
          git -c user.name=clipper -c user.email=clipper@users.noreply.github.com commit -q --amend -m state \
            || git -c user.name=clipper -c user.email=clipper@users.noreply.github.com commit -q -m state
          git push -q -f origin HEAD:data

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: data/out

      - uses: actions/deploy-pages@v4
        if: always()
